[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-dast-audit-mcp"
version = "0.1.0"
description = "Docker/browser-based dynamic vulnerability audit (DAST) MCP server for local repository web apps"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema==4.23.0"]

[project.scripts]
repo-dast-audit-mcp = "repo_dast_audit_mcp.server:main"
repo-dast-audit-setup = "repo_dast_audit_mcp.web_audit.setup:main"

[tool.setuptools.package-data]
"repo_dast_audit_mcp.web_audit" = ["*.json", "*.cjs"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
